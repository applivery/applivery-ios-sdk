codecov:
  branch: master

comment:
  layout: header, changes, diff, sunburst

coverage:
  precision: 2
  round: down
  range: "30...70"
  ignore:
    - Pods/**
    - Applications/Xcode.app/**
    - vendor/**
    - Carthage/**
    - build/**
    - AppliverySDKTests/**
    - AppliveryBehaviorTests/**
  status:
    patch: false
