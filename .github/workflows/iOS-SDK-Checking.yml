name: iOS Test
on:
  push:
jobs:
  build:
    name: Build and Test AppliveryBehaviorTests scheme using any available iPhone simulator, then upload to CocoaPods
    runs-on: macos-15
    
    steps:
      - name: check XCode version
        run: /usr/bin/xcodebuild -version
      
      - name: Checkout
        uses: actions/checkout@v3

      - name: ⚙️ Set script permissions
        run: chmod +x exclude/build_xcframework.sh

      - name: 🔨 Build XCFramework
        # Ejecuta tu script de compilación. 
        # Este script debería generar un archivo zip, por ejemplo, MyFramework.xcframework.zip
        run: ./exclude/build_xcframework.sh