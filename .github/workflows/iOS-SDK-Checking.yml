name: iOS Test
on:
  push:
jobs:
  build:
    name: Build and Test AppliveryBehaviorTests scheme using any available iPhone simulator, then upload to CocoaPods
    runs-on: macos-15
    
    steps:
      - name: check XCode version
        run: /usr/bin/xcodebuild -version
      
      - name: ⬇️ Checkout
        uses: actions/checkout@v3

      - name: ⚙️ Set script permissions
        run: chmod +x exclude/build_xcframework.sh

      - name: 🔨 Build XCFramework
        run: ./exclude/build_xcframework.sh

      - name: 📦 Compress XCFramework
        run: |
            zip -r -X xcframeworks/Applivery.xcframework.zip xcframeworks/Applivery.xcframework
            
      - name: 📦 Find XCFramework zip
        id: find_zip
        run: |
          ZIP_FILE=$(find . -name "*.xcframework.zip" | head -n 1)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::No se encontró el archivo XCFramework.zip"
            exit 1
          fi
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT