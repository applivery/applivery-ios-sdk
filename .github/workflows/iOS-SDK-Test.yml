name: iOS Test
on:
  pull_request:
    branches: [ "develop" , "master"]
jobs:
  build:
    name: Build and Test AppliveryBehaviorTests scheme using any available iPhone simulator, then upload to CocoaPods
    runs-on: macos-15
    
    steps:
      - name: check XCode version
        run: /usr/bin/xcodebuild -version
      
      - name: ⬇️ Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
          
      - name: 🔨 Build and Test
        run: |
            xcodebuild -project AppliverySDK.xcodeproj \
                      -scheme AppliveryBehaviorTests \
                      -sdk iphoneos \
                      -destination 'platform=iOS Simulator,name=iPhone 17' \
                      build test \
                      CODE_SIGN_IDENTITY="" \
                      CODE_SIGNING_REQUIRED=NO \
                      CODE_SIGNING_ALLOWED=NO